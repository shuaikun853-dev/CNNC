# CNNC 关键安全测试 CI（只读、只测）。
# 说明：
# 1. membership 唯一权威 = 测试文件内的 pytestmark = pytest.mark.critical_safety
#    （marker 在 pytest.ini 注册，--strict-markers 全局生效）；GitHub 与本地
#    使用同一 selector：python -m pytest tests -m critical_safety。
# 2. 守卫 = tests/test_critical_suite_governance.py：闭合世界审计（未分类新文件、
#    marker/排除重叠、陈旧排除条目）、关键能力哨兵、收集数单调性基线。
# 3. 原 --deselect（default-dependencies wiring 测试读生产机 gitignored data/
#    curl）已因测试 hermetic 化（stub CnncSaasSnapshotAdapter/load_curl_command）移除。
# 4. 本 workflow 只读只测：无 Secret、无部署、无生产写。
# 5. 触发契约：开发分支(feat/fix/hotfix/refactor)重要文件 push 自动测试；
#    任何 → prod 的 PR 必定产生 Check；workflow_dispatch 已移除
#    （默认分支 main 无本文件，入口不可用）。
name: CNNC Critical Safety Tests

on:
  # 契约 1：GLM 开发分支重要代码 push -> 自动 CI（paths 过滤节省 Actions 分钟；
  # 只改文档/README 等不触发）。分支模式 = 仓库实际开发命名（feat/fix/hotfix/refactor），
  # tmp/*、wip/* 等临时/旁支目录有意不触发。
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
      - refactor/**
      - prod/closeout-20260818
    paths:
      - app/**
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/critical-safety-tests.yml
      - .github/constraints-ci.txt
  # 契约 2：任何指向生产的 PR 必定产生本 Check（不设 paths——
  # 兼容未来 Required Status Check，避免 Workflow 被跳过导致 Check 永远 Pending）。
  pull_request:
    branches:
      - prod/closeout-20260818

permissions:
  contents: read

jobs:
  critical-safety-tests:
    name: CNNC Critical Safety Tests
    runs-on: windows-latest
    # 40min:run #15 实测测试步 24:05(1518 用例,冷 Runner 子进程类放大),30min 余量不足。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --constraint .github/constraints-ci.txt
          # tzdata：ZoneInfo("Asia/Shanghai") 在 Windows 必需（requirements.txt 未声明，见 constraints 注释）
          python -m pip install --constraint .github/constraints-ci.txt pytest-timeout tzdata
      # production-shape prep 保留原因：-m critical_safety 选择器在收集期仍会导入
      # 全部 tests/ 文件——适配器对招商局外部工具做 is_file() 存在性预检
      # （测试自身已 monkeypatch _load_module 注入假工具，桩文件永不执行）；
      # test_dashboard_api 真跑 E:\Python314\python.exe junction 探针。
      # 本步骤只在 Runner 临时盘构造这两条路径（subst + junction），不触任何外部系统。
      - name: Prepare production-shape environment (CI only)
        shell: pwsh
        run: |
          # 生产形状:生产机时区=China Standard Time;production_readiness 的
          # Timezone 检查审计真实宿主(tzutil/UTC偏移/本地日期),Runner 默认 UTC
          # 会让 all-green 用例真 WARN。设为上海让宿主审计真实通过(非 mock)。
          try { Set-Timezone -Id "China Standard Time" -ErrorAction Stop } catch { throw "Set-Timezone failed: $_" }
          $eRoot = Join-Path $env:RUNNER_TEMP "e_drive"
          New-Item -ItemType Directory -Force $eRoot | Out-Null
          cmd /c subst E: "$eRoot"
          if ($LASTEXITCODE -ne 0) { throw "subst E: failed" }
          python -c "from pathlib import Path; p = Path('E:/.A2026/' + '\u62db\u5546\u5c40\u81ea\u52a8\u5efa\u4efb\u52a1' + '/external_tools/crawl_task_tool/auto_crawl_task.py'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('# CI existence stub: tests monkeypatch _load_module; only the is_file() preflight reads this path.\n', encoding='utf-8'); print('STUB_OK', p.is_file())"
          if ($LASTEXITCODE -ne 0) { throw "external tool stub creation failed" }
          $pyDir = Split-Path -Parent (Get-Command python).Source
          cmd /c mklink /J "E:\Python314" "$pyDir"
          if ($LASTEXITCODE -ne 0) { throw "mklink E:\Python314 failed" }
          & "E:\Python314\python.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "junction python not executable" }
          Write-Host "PREPARE_OK"
      # Membership 唯一权威 = 测试文件内 pytestmark（pytest.ini 注册 + 全局
      # --strict-markers）；本地与 CI 同 selector，本文件不再维护测试清单。
      # 治理守卫 = tests/test_critical_suite_governance.py（闭合世界/能力哨兵/
      # 单调性基线）。2026-09-07 迁移实测：1512 收集 / 0 deselect（旧 50 文件
      # 清单为 1387 收集/1 deselect；wiring 测试 hermetic 化后回归 + 新增 8 个
      # gate 文件）。
      - name: Run critical safety tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"  # JS harness 输出 UTF-8，避免 cp1252 Runner 上 subprocess 文本解码崩溃
        run: >
          python -m pytest tests -m critical_safety
          -q -l --durations=25 --timeout=600 --timeout-method=thread
