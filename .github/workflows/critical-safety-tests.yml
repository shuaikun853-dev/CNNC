# CNNC 关键安全测试 CI（只读、只测）。
# 说明：
# 1. 测试清单 = CI_SAFE 纯逻辑安全测试（审计 2026-09-04）。
# 2. --deselect 排除的 tests/test_remote_running_recovery.py::test_default_dependencies_wire_probe_and_write_gated_restart
#    依赖生产机上 gitignored data/ 目录下的 curl 文件（环境差异，非代码 bug）。
# 3. 本 workflow 只读只测：无 Secret、无部署、无生产写。
# 4. 触发契约：开发分支(feat/fix/hotfix/refactor)重要文件 push 自动测试；
#    任何 → prod 的 PR 必定产生 Check；workflow_dispatch 已移除
#    （默认分支 main 无本文件，入口不可用）。
name: CNNC Critical Safety Tests

on:
  # 契约 1：GLM 开发分支重要代码 push -> 自动 CI（paths 过滤节省 Actions 分钟；
  # 只改文档/README 等不触发）。分支模式 = 仓库实际开发命名（feat/fix/hotfix/refactor），
  # tmp/*、wip/* 等临时/旁支目录有意不触发。
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
      - refactor/**
      - prod/closeout-20260818
    paths:
      - app/**
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/critical-safety-tests.yml
      - .github/constraints-ci.txt
  # 契约 2：任何指向生产的 PR 必定产生本 Check（不设 paths——
  # 兼容未来 Required Status Check，避免 Workflow 被跳过导致 Check 永远 Pending）。
  pull_request:
    branches:
      - prod/closeout-20260818

permissions:
  contents: read

jobs:
  critical-safety-tests:
    name: CNNC Critical Safety Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --constraint .github/constraints-ci.txt
          # tzdata：ZoneInfo("Asia/Shanghai") 在 Windows 必需（requirements.txt 未声明，见 constraints 注释）
          python -m pip install --constraint .github/constraints-ci.txt pytest-timeout tzdata
      # 部分安全测试与生产机绝对路径耦合：适配器对招商局外部工具做 is_file()
      # 存在性预检（测试自身已 monkeypatch _load_module 注入假工具，桩文件永不执行）；
      # 自启 preview 语义测试真实执行 E:\Python314\python.exe 探针。
      # 本步骤只在 Runner 临时盘构造这两条路径（subst + junction），不触任何外部系统。
      - name: Prepare production-shape paths (CI only)
        shell: pwsh
        run: |
          $eRoot = Join-Path $env:RUNNER_TEMP "e_drive"
          New-Item -ItemType Directory -Force $eRoot | Out-Null
          cmd /c subst E: "$eRoot"
          if ($LASTEXITCODE -ne 0) { throw "subst E: failed" }
          python -c "from pathlib import Path; p = Path('E:/.A2026/' + '\u62db\u5546\u5c40\u81ea\u52a8\u5efa\u4efb\u52a1' + '/external_tools/crawl_task_tool/auto_crawl_task.py'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('# CI existence stub: tests monkeypatch _load_module; only the is_file() preflight reads this path.\n', encoding='utf-8'); print('STUB_OK', p.is_file())"
          if ($LASTEXITCODE -ne 0) { throw "external tool stub creation failed" }
          $pyDir = Split-Path -Parent (Get-Command python).Source
          cmd /c mklink /J "E:\Python314" "$pyDir"
          if ($LASTEXITCODE -ne 0) { throw "mklink E:\Python314 failed" }
          & "E:\Python314\python.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "junction python not executable" }
          Write-Host "PREPARE_OK"
      # 清单来源：2026-09-04 审计确认的 CI_SAFE 纯逻辑安全测试（50 个文件）+
      # 2026-09-07 Issue #10 新增 5 个文件、Review Round 2 +1（56 个）+
      # 2026-09-09 Issue #10 canary 安全门禁 +1（57 个；--only-mall 硬 scope：
      # other-mall 零写 / URL 超限零写 / 错 mall submit+priority tripwire /
      # 显式路径与路径策略 / 老 schema 无迁移）；本地干净 worktree 实测
      # 1376 收集 / 1375 通过 / 1 失败（唯一失败即下方 --deselect 的那个，
      # 因生产机 gitignored data/ 的 curl 文件在 CI 不存在）。
      - name: Run critical safety tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"  # JS harness 输出 UTF-8，避免 cp1252 Runner 上 subprocess 文本解码崩溃
        run: >
          python -m pytest
          tests/test_canary_scope_gate.py
          tests/test_customer_price_semantics.py
          tests/test_customer_price_projection.py
          tests/test_customer_reference_routing.py
          tests/test_customer_prewarm_dispatch.py
          tests/test_customer_prewarm_dispatch_cli.py
          tests/test_detail_business_retry.py
          tests/test_incremental_price_audit_finalize.py
          tests/test_incremental_price_audit_force_finalize.py
          tests/test_closeout_before_1830.py
          tests/test_closeout_transient_recovery.py
          tests/test_finalize_superseded.py
          tests/test_incremental_audit_materializer.py
          tests/test_daily_audit_store.py
          tests/test_incremental_audit_resilience.py
          tests/test_incremental_price_audit.py
          tests/test_incremental_audit_status.py
          tests/test_harvest_only.py
          tests/test_partial_exact_harvest.py
          tests/test_snapshot_consistency_drift.py
          tests/test_incremental_production_readiness_audit.py
          tests/test_crawl_model_decoupling.py
          tests/test_incremental_audit_recovery.py
          tests/test_recovery_fanout_gate.py
          tests/test_recovery_facade_contract.py
          tests/test_remote_running_recovery.py
          tests/test_remote_stall_breaker.py
          tests/test_remote_stall_classification.py
          tests/test_remote_wait_export_recovery.py
          tests/test_wait_export_transient_recovery.py
          tests/test_remote_priority_zero_rows_recovery.py
          tests/test_priority_retryable_recovery.py
          tests/test_remote_export_no_price_resolution.py
          tests/test_rebuild_crash_recovery.py
          tests/test_model_transient_recovery.py
          tests/test_title_match_model_retry.py
          tests/test_manual_reexport.py
          tests/test_manual_rebuild.py
          tests/test_remote_job_supersede_store.py
          tests/test_live_proof_fallback.py
          tests/test_dashboard_projection.py
          tests/test_dashboard_api.py
          tests/test_safety_guard.py
          tests/test_template_contract.py
          tests/test_sql_selector.py
          tests/test_scope_guard.py
          tests/test_workflow_scope_guard.py
          tests/test_title_match_hard_rules.py
          tests/test_auth_manager.py
          tests/test_cnnc_auth_provider_autorenew.py
          tests/test_cnnc_auth_recover.py
          tests/test_legacy_zhaoshang_adapter.py
          tests/test_legacy_adapter_progress_stop.py
          tests/test_zhaoshang_mall_mapping_aliases.py
          tests/test_zhaoshang_reference_reuse_dedupe.py
          tests/test_zhaoshang_history_backfill.py
          tests/test_cnnc_saas_snapshot_adapter.py
          tests/test_staples_prewarm.py
          tests/test_customer_prewarm_integration.py
          --deselect "tests/test_remote_running_recovery.py::test_default_dependencies_wire_probe_and_write_gated_restart"
          -q -l --timeout=600 --timeout-method=thread
